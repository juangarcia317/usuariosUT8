<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Artículo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f5f5f5; }
        h1   { color: #333; }
        .formulario {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 450px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        label    { display: block; margin-top: 14px; font-weight: bold; color: #555; }
        input, textarea {
            width: 100%; padding: 8px; margin-top: 4px;
            border: 1px solid #ccc; border-radius: 4px;
            box-sizing: border-box; font-size: 14px;
        }
        textarea { resize: vertical; height: 90px; }
        .botones { margin-top: 22px; display: flex; gap: 10px; }
        button, a.btn {
            padding: 10px 20px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 14px; text-decoration: none;
        }
        button.guardar { background-color: #2196F3; color: white; }
        button.guardar:hover { background-color: #1976D2; }
        a.btn.cancelar { background-color: #9e9e9e; color: white; }
        a.btn.cancelar:hover { background-color: #757575; }
    </style>
</head>
<body>

<h1>Alta de Artículo</h1>

<!--
    th:action apunta al endpoint POST /altaarticulo
    th:object vincula el formulario con el objeto "articulo" del modelo
-->
<div class="formulario">
    <form th:action="@{/altaarticulo}" th:object="${articulo}" method="post">

        <label for="name">Nombre del artículo:</label>
        <input type="text" id="name" th:field="*{name}" placeholder="Escribe el nombre" required />

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" th:field="*{descripcion}" placeholder="Descripción del artículo" required></textarea>

        <div class="botones">
            <button type="submit" class="guardar">Guardar</button>
            <a th:href="@{/listadoarticulos}" class="btn cancelar">Cancelar</a>
        </div>

    </form>
</div>

</body>
</html>
